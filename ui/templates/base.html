{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}cRook{{end}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header>
    <a href="/">cRook</a>
    {{if .Session.Name}}
      <span>Playing as <strong>{{.Session.Name}}</strong></span>
    {{else}}
      <span x-data="nameForm()" x-cloak>
        <input x-model="name" placeholder="Your name" maxlength="20">
        <button @click="setName()">Join</button>
      </span>
    {{end}}
  </header>
  <main>
    {{block "content" .}}{{end}}
  </main>
  <script src="/static/app.js"></script>
</body>
</html>{{end}}
